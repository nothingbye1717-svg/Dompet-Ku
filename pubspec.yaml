name: dompetku
version: 2.1.0+3
description: DompetKu - pengurus gaji, bil, resit, bajet dan laporan bulanan.
publish_to: none
environment:
  sdk: '>=3.4.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  intl: ^0.19.0
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4
  file_picker: ^10.3.10
  pdf: ^3.11.1
  printing: ^5.13.1
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4
  open_filex: ^4.5.0
  share_plus: ^10.0.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1
flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon.png
  adaptive_icon_background: '#172029'
  adaptive_icon_foreground: assets/icon_foreground.png
